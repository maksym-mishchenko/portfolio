name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # Reusable installer to skip the duplicate npm ci. Each job below uses
  # actions/setup-node's npm cache, which makes the redundant installs
  # cheap (~5-10s instead of 60-90s) — full deduplication would require
  # a separate "install" job uploading node_modules as an artifact, which
  # for ~50MB takes longer to upload/download than to just reinstall.
  # That's why each job below still runs npm ci; the cache is what saves
  # the minutes, not workflow restructuring.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Diff secret scan
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="$(git rev-parse HEAD^1)"
            head="$(git rev-parse HEAD)"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 "$head")"
          fi

          added_lines="$(git diff --unified=0 "$base" "$head" -- . \
            | grep -E '^\+' \
            | grep -Ev '^\+\+\+' || true)"

          if [ -z "$added_lines" ]; then
            echo "No added lines to scan."
            exit 0
          fi

          patterns=(
            '-----BEGIN (RSA |DSA |EC |OPENSSH |PGP )?PRIVATE KEY-----'
            'AKIA[0-9A-Z]{16}'
            'ASIA[0-9A-Z]{16}'
            'ghp_[A-Za-z0-9_]{36,}'
            'github_pat_[A-Za-z0-9_]{20,}'
            'xox[baprs]-[A-Za-z0-9-]{20,}'
            'sk-[A-Za-z0-9]{32,}'
            'AIza[0-9A-Za-z_-]{35}'
          )

          for pattern in "${patterns[@]}"; do
            if printf '%s\n' "$added_lines" | grep -Eiq -- "$pattern"; then
              echo "::error::Potential high-confidence secret pattern found in added lines."
              exit 1
            fi
          done

          echo "No high-confidence secret patterns found in added lines."

  # Full-history gitleaks scan, consolidated from former gitleaks.yml +
  # secret-scan.yml (those two workflows ran the identical scanner). Not
  # marked as a required status check by branch protection — runs as
  # advisory defense-in-depth alongside the inline 'security' job above.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
