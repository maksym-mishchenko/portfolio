<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" fill="none">
  <style>
    text { font-family: 'Inter', 'SF Pro', -apple-system, sans-serif; }
    .label { font-size: 12px; fill: #94a3b8; }
    .title { font-size: 14px; fill: #e2e8f0; font-weight: 600; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; fill: #a5f3fc; }
    .subtitle { font-size: 11px; fill: #64748b; }
    .box { rx: 10; ry: 10; stroke-width: 1.5; }
    .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow2); }
    .arrow-highlight { stroke: #3b82f6; stroke-width: 2; fill: none; marker-end: url(#arrow-blue); }
    .phase { font-size: 10px; font-weight: 600; letter-spacing: 1.5px; }
  </style>
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="900" height="380" fill="#0a0a0a" rx="16"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" class="phase" fill="#64748b">FROM PROMPT TO WORKING CODE</text>

  <!-- Phase 1: YOU -->
  <text x="120" y="65" text-anchor="middle" class="phase" fill="#f59e0b">YOU</text>

  <rect x="30" y="80" width="180" height="70" class="box" fill="#1e293b" stroke="#f59e0b"/>
  <text x="120" y="105" text-anchor="middle" class="title">💬 Prompt</text>
  <text x="120" y="125" text-anchor="middle" class="mono">"Add pagination to</text>
  <text x="120" y="140" text-anchor="middle" class="mono">the /positions API"</text>

  <!-- Arrow down -->
  <path d="M120,155 L120,180" class="arrow"/>

  <!-- Phase 2: COPILOT CLI -->
  <text x="120" y="195" text-anchor="middle" class="phase" fill="#3b82f6">COPILOT CLI</text>

  <!-- Read -->
  <rect x="30" y="210" width="180" height="55" class="box" fill="#172554" stroke="#1d4ed8"/>
  <text x="120" y="233" text-anchor="middle" class="title">📖 Read Codebase</text>
  <text x="120" y="253" text-anchor="middle" class="subtitle">grep, LSP, file analysis</text>

  <path d="M215,237 L255,237" class="arrow-highlight"/>

  <!-- Plan -->
  <rect x="260" y="210" width="180" height="55" class="box" fill="#172554" stroke="#1d4ed8"/>
  <text x="350" y="233" text-anchor="middle" class="title">🧠 Plan Changes</text>
  <text x="350" y="253" text-anchor="middle" class="subtitle">rubber-duck → validate</text>

  <path d="M445,237 L485,237" class="arrow-highlight"/>

  <!-- Edit -->
  <rect x="490" y="210" width="180" height="55" class="box" fill="#172554" stroke="#1d4ed8"/>
  <text x="580" y="233" text-anchor="middle" class="title">✏️ Edit Files</text>
  <text x="580" y="253" text-anchor="middle" class="subtitle">surgical code changes</text>

  <path d="M675,237 L715,237" class="arrow-highlight"/>

  <!-- Test -->
  <rect x="720" y="210" width="150" height="55" class="box" fill="#172554" stroke="#1d4ed8"/>
  <text x="795" y="233" text-anchor="middle" class="title">🧪 Test</text>
  <text x="795" y="253" text-anchor="middle" class="subtitle">run existing tests</text>

  <!-- Arrow down from test -->
  <path d="M795,270 L795,300" class="arrow"/>

  <!-- Phase 3: OUTPUT -->
  <text x="450" y="315" text-anchor="middle" class="phase" fill="#22c55e">OUTPUT</text>

  <!-- Results -->
  <rect x="180" y="325" width="150" height="45" class="box" fill="#14532d" stroke="#16a34a"/>
  <text x="255" y="353" text-anchor="middle" class="title">✅ Git Commit</text>

  <rect x="375" y="325" width="150" height="45" class="box" fill="#14532d" stroke="#16a34a"/>
  <text x="450" y="353" text-anchor="middle" class="title">📋 PR Ready</text>

  <rect x="570" y="325" width="150" height="45" class="box" fill="#14532d" stroke="#16a34a"/>
  <text x="645" y="353" text-anchor="middle" class="title">🚀 Deployed</text>

  <!-- Connect test to outputs -->
  <path d="M795,300 L795,310 L645,310 L645,320" class="arrow"/>
  <path d="M795,300 L795,310 L450,310 L450,320" class="arrow"/>
  <path d="M795,300 L795,310 L255,310 L255,320" class="arrow"/>
</svg>
