<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" fill="none">
  <style>
    text { font-family: 'Inter', 'SF Pro', -apple-system, sans-serif; }
    .label { font-size: 13px; fill: #94a3b8; }
    .title { font-size: 15px; fill: #e2e8f0; font-weight: 600; }
    .subtitle { font-size: 11px; fill: #64748b; }
    .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .box { rx: 12; ry: 12; stroke-width: 1.5; }
    .era { font-size: 10px; fill: #475569; font-weight: 500; letter-spacing: 1px; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="#0a0a0a" rx="16"/>

  <!-- Header -->
  <text x="450" y="32" text-anchor="middle" class="label" style="font-size:12px; letter-spacing:2px;">HOW I GOT HERE</text>

  <!-- Step 1: ChatGPT -->
  <rect x="30" y="55" width="180" height="110" class="box" fill="#1e293b" stroke="#334155"/>
  <text x="120" y="80" text-anchor="middle" class="era">2023</text>
  <text x="120" y="105" text-anchor="middle" class="title">💬 ChatGPT</text>
  <text x="120" y="125" text-anchor="middle" class="subtitle">Copy → Paste → Pray</text>
  <text x="120" y="145" text-anchor="middle" class="subtitle">Zero context about</text>
  <text x="120" y="158" text-anchor="middle" class="subtitle">my actual code</text>

  <!-- Arrow 1 -->
  <path d="M215,110 L250,110" class="arrow"/>

  <!-- Step 2: Copilot Chat -->
  <rect x="255" y="55" width="180" height="110" class="box" fill="#1e293b" stroke="#334155"/>
  <text x="345" y="80" text-anchor="middle" class="era">2024</text>
  <text x="345" y="105" text-anchor="middle" class="title">🤖 Copilot Chat</text>
  <text x="345" y="125" text-anchor="middle" class="subtitle">IDE context helped</text>
  <text x="345" y="145" text-anchor="middle" class="subtitle">Still: "apply this</text>
  <text x="345" y="158" text-anchor="middle" class="subtitle">manually yourself"</text>

  <!-- Arrow 2 -->
  <path d="M440,110 L475,110" class="arrow"/>

  <!-- Step 3: Copilot CLI -->
  <rect x="480" y="55" width="180" height="110" class="box" fill="#172554" stroke="#1d4ed8"/>
  <text x="570" y="80" text-anchor="middle" class="era">2025</text>
  <text x="570" y="105" text-anchor="middle" class="title">⚡ Copilot CLI</text>
  <text x="570" y="125" text-anchor="middle" class="subtitle">Runs commands,</text>
  <text x="570" y="145" text-anchor="middle" class="subtitle">edits files, creates PRs</text>
  <text x="570" y="158" text-anchor="middle" class="subtitle">Full repo context</text>

  <!-- Arrow 3 -->
  <path d="M665,110 L700,110" class="arrow"/>

  <!-- Step 4: Multi-Agent -->
  <rect x="705" y="55" width="180" height="110" class="box" fill="#14532d" stroke="#16a34a"/>
  <text x="795" y="80" text-anchor="middle" class="era">NOW</text>
  <text x="795" y="105" text-anchor="middle" class="title">🧠 Multi-Agent</text>
  <text x="795" y="125" text-anchor="middle" class="subtitle">Copilot CLI + OpenClaw</text>
  <text x="795" y="145" text-anchor="middle" class="subtitle">+ OpenCode working</text>
  <text x="795" y="158" text-anchor="middle" class="subtitle">as a team</text>

  <!-- Progress bar -->
  <rect x="30" y="185" width="855" height="4" rx="2" fill="#1e293b"/>
  <rect x="30" y="185" width="855" height="4" rx="2" fill="url(#progress)"/>
  <defs>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Bottom labels -->
  <text x="120" y="210" text-anchor="middle" class="subtitle">manual</text>
  <text x="345" y="210" text-anchor="middle" class="subtitle">assisted</text>
  <text x="570" y="210" text-anchor="middle" class="subtitle">autonomous</text>
  <text x="795" y="210" text-anchor="middle" class="subtitle">orchestrated</text>
</svg>
